name: Universal Hugo DevSecOps Verification

on:
  workflow_call:
    inputs:
      hugo-version:
        description: "Hugo version to install"
        required: false
        type: string
        default: "latest"
      python-version:
        description: "Python version for test suite execution"
        required: false
        type: string
        default: "3.12"
      extended:
        description: "Use Hugo Extended edition"
        required: false
        type: boolean
        default: true
      upload-artifact:
        description: "Whether to upload compiled public/ artifacts"
        required: false
        type: boolean
        default: true
      artifact-name:
        description: "Name of the uploaded artifact"
        required: false
        type: string
        default: "verified-public-site"
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Build & Verify (Universal DevSecOps Gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # DevSecOps Gate 1: Secret and credential scanning
      - name: Scan for Leaked Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Inject sanitized build telemetry into data/ before Hugo compilation
      - name: Generate Build Telemetry Data
        run: |
          mkdir -p data
          cat <<EOF > data/build_telemetry.json
          {
            "build_time_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "git_commit_sha": "${{ github.sha }}",
            "git_commit_short": "$(git rev-parse --short HEAD 2>/dev/null || echo '${{ github.sha }}' | cut -c1-7)",
            "quality_gates": "Universal Hugo DevSecOps Engine",
            "gitleaks_status": "Clean (0 secrets detected)",
            "engine": "Hugo Extended"
          }
          EOF

      # Set up static site generator (Hugo Extended)
      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo-version || 'latest' }}
          extended: ${{ inputs.extended != false }}

      # Compile immutable static assets
      - name: Build Hugo Site
        run: hugo --minify --gc --cleanDestinationDir

      # Set up Python for headless HTML & DevSecOps quality gates
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}

      # DevSecOps Gate 2: Headless Python quality, accessibility & security test suite
      - name: Run Universal DevSecOps & Quality Test Suite
        run: python -m unittest discover -s tests -v

      # Archive verified static artifact for pluggable deployment adapters
      - name: Upload Verified Static Artifact
        if: ${{ inputs.upload-artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'verified-public-site' }}
          path: public/
          retention-days: 1
