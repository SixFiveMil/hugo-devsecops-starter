{{ define "main" }}
<section class="taxo-list">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}
  <div class="content">{{ . }}</div>
  {{ end }}
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Summary }}
      <p>{{ . }}</p>
      {{ end }}
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
